<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="emeraldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#064E3B" />
      <stop offset="50%" stopColor="#047857" />
      <stop offset="100%" stopColor="#022C22" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FDE68A" />
      <stop offset="40%" stopColor="#F59E0B" />
      <stop offset="80%" stopColor="#D97706" />
      <stop offset="100%" stopColor="#B45309" />
    </linearGradient>
    <linearGradient id="riceGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="60%" stopColor="#FEF3C7" />
      <stop offset="100%" stopColor="#FDE68A" />
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="92" height="92" rx="26" fill="url(#emeraldBg)" stroke="url(#goldGrad)" stroke-width="4" />
  <circle cx="50" cy="50" r="40" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6" />

  <!-- Left Rice Sheaf -->
  <g stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M 28 72 C 24 54, 30 36, 46 22" />
    <ellipse cx="26" cy="62" rx="4.5" ry="2.2" fill="url(#goldGrad)" transform="rotate(-30 26 62)" stroke="none" />
    <ellipse cx="28" cy="50" rx="4.8" ry="2.3" fill="url(#goldGrad)" transform="rotate(-20 28 50)" stroke="none" />
    <ellipse cx="33" cy="39" rx="4.8" ry="2.3" fill="url(#goldGrad)" transform="rotate(-10 33 39)" stroke="none" />
    <ellipse cx="40" cy="29" rx="4.5" ry="2.2" fill="url(#goldGrad)" transform="rotate(5 40 29)" stroke="none" />
  </g>

  <!-- Right Rice Sheaf -->
  <g stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M 72 72 C 76 54, 70 36, 54 22" />
    <ellipse cx="74" cy="62" rx="4.5" ry="2.2" fill="url(#goldGrad)" transform="rotate(30 74 62)" stroke="none" />
    <ellipse cx="72" cy="50" rx="4.8" ry="2.3" fill="url(#goldGrad)" transform="rotate(20 72 50)" stroke="none" />
    <ellipse cx="67" cy="39" rx="4.8" ry="2.3" fill="url(#goldGrad)" transform="rotate(10 67 39)" stroke="none" />
    <ellipse cx="60" cy="29" rx="4.5" ry="2.2" fill="url(#goldGrad)" transform="rotate(-5 60 29)" stroke="none" />
  </g>

  <!-- Rice Grain -->
  <path d="M 50 18 C 58 32, 60 52, 50 80 C 40 52, 42 32, 50 18 Z" fill="url(#riceGrad)" />
  <path d="M 50 24 C 52 42, 52 58, 50 74" stroke="#D97706" stroke-width="1.2" stroke-linecap="round" opacity="0.75" />

  <!-- Monogram text -->
  <text x="50" y="58" text-anchor="middle" font-size="17" font-weight="900" font-family="sans-serif" fill="#047857">العرب</text>

  <circle cx="50" cy="85" r="2.5" fill="url(#goldGrad)" />
</svg>
